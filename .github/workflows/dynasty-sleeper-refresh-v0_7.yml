name: Dynasty Sleeper Refresh


on:
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week (leave blank to use Sleeper's current week)"
        required: false
        default: ""
        type: string
      finalize_week:
        description: "Create the permanent final snapshot for the selected week"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "15 3 * * 2"
      timezone: "America/New_York"
    - cron: "0 8 * * 2"
      timezone: "America/New_York"
    - cron: "0 19 * * 4"
      timezone: "America/New_York"
    - cron: "0 12 * * 0"
      timezone: "America/New_York"
    - cron: "0 19 * * 1"
      timezone: "America/New_York"


jobs:
  refresh:
    runs-on: ubuntu-latest


    steps:
      - name: Check out repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          pip install requests pandas


      - name: Test league-wide finalization
        run: python -m unittest discover -s tests -p test_league_final.py -v

      - name: Download prior validated baseline from Google Drive
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          rm -rf baseline
          python -m dynasty_sleeper.drive_sync download --dest baseline


      - name: Resolve week and run mode
        id: run_context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_WEEK: ${{ inputs.week }}
          MANUAL_FINALIZE: ${{ inputs.finalize_week }}
        run: |
          FINALIZE="false"
          if [[ "$EVENT_SCHEDULE" == "15 3 * * 2" || "$MANUAL_FINALIZE" == "true" ]]; then
            FINALIZE="true"
          fi


          if [[ -n "$MANUAL_WEEK" ]]; then
            WEEK="$MANUAL_WEEK"
          else
            CURRENT_WEEK="$(python - <<'PY'
          import requests
          response = requests.get("https://api.sleeper.app/v1/state/nfl", timeout=30)
          response.raise_for_status()
          print(int(response.json()["week"]))
          PY
          )"
            if [[ "$FINALIZE" == "true" ]]; then
              WEEK="$((CURRENT_WEEK - 1))"
            else
              WEEK="$CURRENT_WEEK"
            fi
          fi

          if ! [[ "$WEEK" =~ ^[0-9]+$ ]] || (( WEEK < 1 || WEEK > 18 )); then
            echo "Invalid resolved NFL week: $WEEK" >&2
            exit 2
          fi


          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "finalize=$FINALIZE" >> "$GITHUB_OUTPUT"


      - name: Resolve validated pregame context for requested final week
        if: ${{ steps.run_context.outputs.finalize == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m dynasty_sleeper.pregame_recovery \
            --week "${{ steps.run_context.outputs.week }}" \
            --baseline baseline \
            --output archived-context/pregame_context.csv

      - name: Run live Sleeper refresh with drift reconciliation
        shell: bash
        run: |
          rm -rf output
          mkdir -p output


          if [[ -f baseline/league_transactions_master.csv ]]; then
            cp baseline/league_transactions_master.csv output/league_transactions_master.csv
          fi


          PREVIOUS_STATE_ARGS=()
          if [[ -f baseline/league_state_current.csv ]]; then
            PREVIOUS_STATE_ARGS=(--previous-state baseline/league_state_current.csv)
          fi


          FINALIZE_ARGS=()
          if [[ "${{ steps.run_context.outputs.finalize }}" == "true" ]]; then
            PREGAME_CONTEXT="archived-context/pregame_context.csv"
            FINALIZE_ARGS=(
              --finalize-week
              --pregame-context "$PREGAME_CONTEXT"
            )
          fi


          python -m dynasty_sleeper.cli \
            --week "${{ steps.run_context.outputs.week }}" \
            --output-dir output \
            "${PREVIOUS_STATE_ARGS[@]}" \
            "${FINALIZE_ARGS[@]}"


      - name: Show manifest
        if: always()
        run: |
          if [[ -f output/manifest.json ]]; then
            cat output/manifest.json
          fi


      - name: Persist validated baseline to Google Drive
        if: ${{ steps.run_context.outputs.finalize != 'true' }}
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python -m dynasty_sleeper.drive_sync upload --source output


      - name: Publish permanent final snapshot to Google Drive
        if: ${{ steps.run_context.outputs.finalize == 'true' }}
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python -m dynasty_sleeper.drive_sync upload-final --source output


      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sleeper-refresh-week-${{ steps.run_context.outputs.week }}
          path: output/
          if-no-files-found: error
          retention-days: 30