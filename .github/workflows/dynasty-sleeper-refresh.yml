name: Dynasty Sleeper Refresh

on:
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week"
        required: true
        default: "1"

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests pandas

      - name: Run live Sleeper refresh
        run: |
          rm -rf output
          python -m dynasty_sleeper.cli --week "${{ inputs.week }}" --output-dir output

      - name: Show manifest
        if: always()
        run: |
          if [ -f output/manifest.json ]; then
            cat output/manifest.json
          fi

      - name: Upload validated Sleeper bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sleeper-refresh-week-${{ inputs.week }}
          path: output/
          if-no-files-found: error
          retention-days: 14
