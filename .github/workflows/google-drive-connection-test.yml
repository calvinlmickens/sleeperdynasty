name: Google Drive Connection Test

on:
  workflow_dispatch:

jobs:
  drive-test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: pip install requests

      - name: Test OAuth and Drive folder access
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import requests

          required = [
              "GOOGLE_OAUTH_CLIENT_ID",
              "GOOGLE_OAUTH_CLIENT_SECRET",
              "GOOGLE_OAUTH_REFRESH_TOKEN",
              "GOOGLE_DRIVE_FOLDER_ID",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print(json.dumps({"status": "FAIL", "stage": "secrets", "missing": missing}, indent=2))
              sys.exit(2)

          token_resp = requests.post(
              "https://oauth2.googleapis.com/token",
              data={
                  "client_id": os.environ["GOOGLE_OAUTH_CLIENT_ID"],
                  "client_secret": os.environ["GOOGLE_OAUTH_CLIENT_SECRET"],
                  "refresh_token": os.environ["GOOGLE_OAUTH_REFRESH_TOKEN"],
                  "grant_type": "refresh_token",
              },
              timeout=30,
          )
          if not token_resp.ok:
              print(json.dumps({
                  "status": "FAIL",
                  "stage": "oauth_token_exchange",
                  "http_status": token_resp.status_code,
                  "response": token_resp.text[:1000],
              }, indent=2))
              sys.exit(2)

          access_token = token_resp.json().get("access_token")
          headers = {"Authorization": f"Bearer {access_token}"}
          folder_id = os.environ["GOOGLE_DRIVE_FOLDER_ID"]

          folder_resp = requests.get(
              f"https://www.googleapis.com/drive/v3/files/{folder_id}",
              headers=headers,
              params={"fields": "id,name,mimeType,capabilities(canAddChildren,canEdit)"},
              timeout=30,
          )
          if not folder_resp.ok:
              print(json.dumps({
                  "status": "FAIL",
                  "stage": "folder_access",
                  "http_status": folder_resp.status_code,
                  "response": folder_resp.text[:1000],
                  "note": "OAuth worked, but this app token cannot access the configured My Drive folder.",
              }, indent=2))
              sys.exit(2)

          folder = folder_resp.json()
          if folder.get("mimeType") != "application/vnd.google-apps.folder":
              print(json.dumps({"status": "FAIL", "stage": "folder_validation", "folder": folder}, indent=2))
              sys.exit(2)

          metadata = {
              "name": "dynasty_sleeper_connection_test.txt",
              "parents": [folder_id],
              "mimeType": "text/plain",
          }
          create_resp = requests.post(
              "https://www.googleapis.com/drive/v3/files",
              headers={**headers, "Content-Type": "application/json"},
              params={"fields": "id,name,parents"},
              json=metadata,
              timeout=30,
          )
          if not create_resp.ok:
              print(json.dumps({
                  "status": "FAIL",
                  "stage": "create_test_file",
                  "http_status": create_resp.status_code,
                  "response": create_resp.text[:1000],
                  "folder": folder,
              }, indent=2))
              sys.exit(2)

          file_id = create_resp.json()["id"]
          upload_resp = requests.patch(
              f"https://www.googleapis.com/upload/drive/v3/files/{file_id}",
              headers={**headers, "Content-Type": "text/plain"},
              params={"uploadType": "media"},
              data=b"Dynasty Sleeper Google Drive connection test: PASS\n",
              timeout=30,
          )
          if not upload_resp.ok:
              print(json.dumps({
                  "status": "FAIL",
                  "stage": "upload_test_content",
                  "http_status": upload_resp.status_code,
                  "response": upload_resp.text[:1000],
                  "test_file_id": file_id,
              }, indent=2))
              sys.exit(2)

          delete_resp = requests.delete(
              f"https://www.googleapis.com/drive/v3/files/{file_id}",
              headers=headers,
              timeout=30,
          )

          print(json.dumps({
              "status": "PASS",
              "oauth_token_exchange": "PASS",
              "folder_access": "PASS",
              "folder_name": folder.get("name"),
              "can_add_children": folder.get("capabilities", {}).get("canAddChildren"),
              "test_file_create": "PASS",
              "test_file_content_upload": "PASS",
              "test_file_cleanup": "PASS" if delete_resp.ok else f"REVIEW_HTTP_{delete_resp.status_code}",
          }, indent=2))
          PY
