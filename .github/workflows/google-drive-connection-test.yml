name: Google Drive Connection Test

on:
  workflow_dispatch:

jobs:
  drive-test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: |
          pip install requests

      - name: Create app-owned Drive folder and test access
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import requests

          client_id = os.environ["GOOGLE_OAUTH_CLIENT_ID"]
          client_secret = os.environ["GOOGLE_OAUTH_CLIENT_SECRET"]
          refresh_token = os.environ["GOOGLE_OAUTH_REFRESH_TOKEN"]

          token_resp = requests.post(
              "https://oauth2.googleapis.com/token",
              data={
                  "client_id": client_id,
                  "client_secret": client_secret,
                  "refresh_token": refresh_token,
                  "grant_type": "refresh_token",
              },
              timeout=30,
          )

          if token_resp.status_code != 200:
              print(json.dumps({
                  "status": "FAIL",
                  "stage": "token_exchange",
                  "http_status": token_resp.status_code,
                  "response": token_resp.text,
              }, indent=2))
              sys.exit(2)

          access_token = token_resp.json()["access_token"]
          headers = {"Authorization": f"Bearer {access_token}"}

          # Create app-owned folder
          folder_metadata = {
              "name": "Dynasty Sleeper Automation",
              "mimeType": "application/vnd.google-apps.folder",
          }

          folder_resp = requests.post(
              "https://www.googleapis.com/drive/v3/files",
              headers={**headers, "Content-Type": "application/json"},
              json=folder_metadata,
              params={"fields": "id,name"},
              timeout=30,
          )

          if folder_resp.status_code not in (200, 201):
              print(json.dumps({
                  "status": "FAIL",
                  "stage": "folder_create",
                  "http_status": folder_resp.status_code,
                  "response": folder_resp.text,
              }, indent=2))
              sys.exit(2)

          folder = folder_resp.json()
          folder_id = folder["id"]

          print("APP_OWNED_DRIVE_FOLDER_CREATED")
          print(f"GOOGLE_DRIVE_FOLDER_ID={folder_id}")
          print(f"Folder name: {folder.get('name')}")

          # Create test file in folder
          file_metadata = {
              "name": "dynasty_sleeper_connection_test.txt",
              "parents": [folder_id],
          }

          multipart_boundary = "foo_bar_baz"
          metadata_json = json.dumps(file_metadata)
          file_content = "Dynasty Sleeper Google Drive connection test passed."

          body = (
              f"--{multipart_boundary}\r\n"
              "Content-Type: application/json; charset=UTF-8\r\n\r\n"
              f"{metadata_json}\r\n"
              f"--{multipart_boundary}\r\n"
              "Content-Type: text/plain\r\n\r\n"
              f"{file_content}\r\n"
              f"--{multipart_boundary}--"
          )

          upload_resp = requests.post(
              "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,parents",
              headers={
                  **headers,
                  "Content-Type": f"multipart/related; boundary={multipart_boundary}",
              },
              data=body.encode("utf-8"),
              timeout=30,
          )

          if upload_resp.status_code not in (200, 201):
              print(json.dumps({
                  "status": "FAIL",
                  "stage": "test_file_create",
                  "http_status": upload_resp.status_code,
                  "response": upload_resp.text,
                  "folder_id": folder_id,
              }, indent=2))
              sys.exit(2)

          test_file = upload_resp.json()
          test_file_id = test_file["id"]

          # Verify file
          verify_resp = requests.get(
              f"https://www.googleapis.com/drive/v3/files/{test_file_id}",
              headers=headers,
              params={"fields": "id,name,parents"},
              timeout=30,
          )

          if verify_resp.status_code != 200:
              print(json.dumps({
                  "status": "FAIL",
                  "stage": "test_file_verify",
                  "http_status": verify_resp.status_code,
                  "response": verify_resp.text,
                  "folder_id": folder_id,
              }, indent=2))
              sys.exit(2)

          # Delete test file
          delete_resp = requests.delete(
              f"https://www.googleapis.com/drive/v3/files/{test_file_id}",
              headers=headers,
              timeout=30,
          )

          if delete_resp.status_code not in (204, 200):
              print(json.dumps({
                  "status": "FAIL",
                  "stage": "test_file_cleanup",
                  "http_status": delete_resp.status_code,
                  "response": delete_resp.text,
                  "folder_id": folder_id,
              }, indent=2))
              sys.exit(2)

          print(json.dumps({
              "status": "PASS",
              "oauth_token_exchange": "PASS",
              "folder_create": "PASS",
              "folder_id": folder_id,
              "test_file_create": "PASS",
              "test_file_verify": "PASS",
              "test_file_cleanup": "PASS",
          }, indent=2))
          PY
