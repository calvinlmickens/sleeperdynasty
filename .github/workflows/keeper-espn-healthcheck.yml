name: Keeper ESPN Health Check

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest

    env:
      ESPN_LEAGUE_ID: "25456"
      ESPN_TEAM_ID: "1"
      ESPN_SEASON: "2026"
      ESPN_TEAM_NAME: "Taylor Made"
      SWID: ${{ secrets.SWID }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Restore prior validated Keeper state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prior_run_id="$(gh run list \
            --workflow keeper-espn-healthcheck.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId' || true)"
          if [ -n "$prior_run_id" ]; then
            mkdir -p keeper_live_test/last_known_good
            gh run download "$prior_run_id" \
              --name keeper-live-state \
              --dir keeper_live_test/last_known_good || true
          fi

      - name: Run live Keeper refresh
        run: keeper-refresh --output-dir keeper_live_test

      - name: Show validation and delta result
        run: |
          cat keeper_live_test/latest/manifest.json
          echo
          cat keeper_live_test/latest/delta_state.json

      - name: Upload live Keeper state
        uses: actions/upload-artifact@v4
        with:
          name: keeper-live-state
          path: keeper_live_test/latest/
          retention-days: 14
